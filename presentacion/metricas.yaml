# Catalogo de metricas de la presentacion de fin de ano de MapTap.
# Cada metrica define COMO SE CALCULA. El generador ejecuta `sql` (si existe), escribe la nota al pie de cada diapositiva y arma el anexo desde este archivo.
#
# Parametros comunes de las consultas:
#   :hasta   fecha de corte = ultimo dia cerrado (AAAA-MM-DD). Se obtiene con: SELECT MAX(fecha) FROM dim_fecha WHERE dia_cerrado=1
#   :jug     alias de un jugador (solo perfiles)
#   :rondas  lista JSON de rondas, ej. '[1,2]' (solo metricas por ronda)
# Filtros comunes (salvo que se indique otra cosa): es_profesional=1 (desde 2026-09-02), fecha<=:hasta, Challenge excluido.
# Puntaje de analisis: nominal por ronda (0-100, fact_puntaje). El puntaje final (fact_partida.puntaje_final) solo se usa en torneo (podios, copas, medallero, divisiones).
# Muestra minima por jugador y zona/categoria: n>=10 rondas (5-9 atenuado con asterisco, <5 no se muestra). Metricas de grupo por zona: >=5 ubicaciones distintas.
# Exceso = puntaje del jugador - promedio de todos los jugadores en esa misma fecha y ronda (neutraliza la dificultad del dia).
# Dif = promedio del jugador en una zona/categoria - promedio general del mismo jugador en el periodo.
# Redondeo: 1 decimal y coma decimal en presentacion; el calculo usa precision completa.

# ====================== A. RESUMEN DEL TORNEO ======================
- id: a_partidas
  nombre: Partidas jugadas en el periodo
  seccion: A
  definicion: Cantidad de partidas (un jugador en un dia) del periodo.
  calculo: "Contar filas de fact_partida cuya fecha esta en el periodo."
  sql: "SELECT COUNT(*) FROM fact_partida p JOIN dim_fecha f USING(fecha) WHERE f.es_profesional=1 AND p.fecha<=:hasta"
  n_minimo: 0
  unidad: partidas
  grafico: cifra destacada
- id: a_ubicaciones
  nombre: Ubicaciones y lugares distintos
  seccion: A
  definicion: Ubicaciones jugadas (5 por dia) y lugares distintos entre ellas (un lugar puede repetirse).
  calculo: "Ubicaciones = filas de fact_aparicion del periodo; lugares distintos = id_lugar distintos."
  sql: "SELECT COUNT(*) AS ubicaciones, COUNT(DISTINCT a.id_lugar) AS lugares FROM fact_aparicion a JOIN dim_fecha f USING(fecha) WHERE f.es_profesional=1 AND a.fecha<=:hasta"
  unidad: cantidad
  grafico: cifra destacada
- id: a_prom_grupo
  nombre: Promedio nominal del grupo
  seccion: A
  definicion: Promedio de todos los puntajes de ronda de todos los jugadores en el periodo.
  calculo: "AVG(puntaje) sobre v_puntaje."
  sql: "SELECT ROUND(AVG(puntaje),2) FROM v_puntaje WHERE es_profesional=1 AND fecha<=:hasta"
  unidad: puntos (0 a 100)
  interpretacion: Referencia contra la cual se mide a cada jugador.
  grafico: cifra destacada
- id: a_prom_diario_grupo
  nombre: Promedio diario del grupo y media movil de 7 dias
  seccion: A
  definicion: Promedio de los puntajes de ronda del grupo en cada dia, y su media movil de los 7 dias de calendario de juego anteriores (incluye el dia).
  calculo: "Por fecha: AVG(puntaje). Media movil: promedio simple de los ultimos 7 valores diarios (ventana de 7 filas, 1.o a 6.o dia con ventana parcial)."
  sql: "WITH d AS (SELECT fecha, AVG(puntaje) AS x FROM v_puntaje WHERE es_profesional=1 AND fecha<=:hasta GROUP BY fecha) SELECT fecha, ROUND(x,2) AS prom, ROUND(AVG(x) OVER (ORDER BY fecha ROWS 6 PRECEDING),2) AS mm7 FROM d ORDER BY fecha"
  unidad: puntos
  grafico: lineas (diario tenue + media movil)
- id: a_dist_puntajes
  nombre: Distribucion de puntajes de ronda
  seccion: A
  definicion: Cantidad de rondas por tramo de 10 puntos (100 va en su propio tramo).
  calculo: "Tramo = 100 si puntaje=100, si no FLOOR(puntaje/10)*10."
  sql: "SELECT CASE WHEN puntaje=100 THEN 100 ELSE (puntaje/10)*10 END AS tramo, COUNT(*) AS rondas FROM v_puntaje WHERE es_profesional=1 AND fecha<=:hasta GROUP BY tramo ORDER BY tramo"
  unidad: rondas
  grafico: histograma
- id: a_dias_extremos
  nombre: Dias mas faciles y mas dificiles del grupo
  seccion: A
  definicion: Los 5 dias con mayor y con menor promedio nominal del grupo.
  calculo: "AVG(puntaje) por fecha; ordenar descendente (faciles) y ascendente (dificiles); tomar 5. Exigir 8 o mas jugadores ese dia."
  sql: "SELECT fecha, ROUND(AVG(puntaje),2) AS prom, COUNT(DISTINCT jugador) AS jugadores FROM v_puntaje WHERE es_profesional=1 AND fecha<=:hasta GROUP BY fecha HAVING jugadores>=8 ORDER BY prom DESC"
  unidad: puntos
  grafico: barras (top 5 y bottom 5)
- id: a_record_100_dia
  nombre: Mayor cantidad de 100 en un dia
  seccion: A
  definicion: Maxima cantidad de rondas con 100 que un jugador logro en un mismo dia.
  calculo: "Por jugador y fecha: contar rondas con puntaje=100; tomar el maximo."
  sql: "SELECT jugador, fecha, SUM(puntaje=100) AS cienes FROM v_puntaje WHERE es_profesional=1 AND fecha<=:hasta GROUP BY jugador, fecha ORDER BY cienes DESC, fecha LIMIT 10"
  unidad: rondas
  grafico: tabla destacada

# ====================== B. RANKINGS GENERALES ======================
- id: prom_nominal
  nombre: Promedio nominal por ronda
  seccion: B
  definicion: Promedio de los puntajes de ronda (0 a 100) de un jugador en el periodo.
  calculo: "AVG(puntaje) por jugador sobre v_puntaje."
  sql: "SELECT jugador, COUNT(*) AS n, ROUND(AVG(puntaje),2) AS prom FROM v_puntaje WHERE es_profesional=1 AND fecha<=:hasta GROUP BY jugador ORDER BY prom DESC"
  n_minimo: 100
  unidad: puntos (0 a 100)
  interpretacion: Mayor es mejor; no corrige por dificultad.
  grafico: barras horizontales
- id: b_exceso_prom
  nombre: Exceso promedio sobre el grupo
  seccion: B
  definicion: Cuanto mas (o menos) puntos saca el jugador que el promedio del grupo en las mismas rondas.
  calculo: "Por cada ronda jugada: puntaje - promedio de todos los jugadores en esa fecha y ronda; luego promedio por jugador."
  sql: "WITH g AS (SELECT fecha, ronda, AVG(puntaje) AS m FROM v_puntaje WHERE es_profesional=1 AND fecha<=:hasta GROUP BY fecha, ronda) SELECT p.jugador, COUNT(*) AS n, ROUND(AVG(p.puntaje-g.m),2) AS exceso FROM v_puntaje p JOIN g USING(fecha, ronda) WHERE p.es_profesional=1 AND p.fecha<=:hasta GROUP BY p.jugador ORDER BY exceso DESC"
  n_minimo: 100
  unidad: puntos
  interpretacion: Comparacion justa entre jugadores que no jugaron los mismos dias.
  grafico: barras divergentes
- id: b_pct_100
  nombre: Porcentaje de rondas con 100
  seccion: B
  definicion: Proporcion de rondas en que el jugador saco 100.
  calculo: "SUM(puntaje=100) / COUNT(*) por jugador."
  sql: "SELECT jugador, SUM(puntaje=100) AS cienes, COUNT(*) AS n, ROUND(100.0*SUM(puntaje=100)/COUNT(*),2) AS pct FROM v_puntaje WHERE es_profesional=1 AND fecha<=:hasta GROUP BY jugador ORDER BY pct DESC"
  n_minimo: 100
  unidad: porcentaje
  grafico: barras horizontales
- id: b_prom_final
  nombre: Puntaje final promedio por partida
  seccion: B
  definicion: Promedio del puntaje final (con multiplicador del juego) por partida jugada.
  calculo: "AVG(puntaje_final) por jugador sobre fact_partida del periodo."
  sql: "SELECT j.alias AS jugador, COUNT(*) AS partidas, ROUND(AVG(p.puntaje_final),1) AS prom_final FROM fact_partida p JOIN dim_fecha f USING(fecha) JOIN dim_jugador j USING(id_jugador) WHERE f.es_profesional=1 AND p.fecha<=:hasta GROUP BY j.alias ORDER BY prom_final DESC"
  n_minimo: 20
  unidad: puntos finales
  interpretacion: Es la escala del torneo; el analisis de desempeno usa el nominal.
  grafico: barras horizontales
- id: b_desvio_diario
  nombre: Consistencia (desvio de los promedios diarios)
  seccion: B
  definicion: Desvio estandar poblacional de los promedios nominales diarios de cada jugador; menor es mas regular.
  calculo: "Por jugador y fecha: x = AVG(puntaje). Desvio = SQRT(AVG(x^2) - AVG(x)^2) sobre los dias jugados."
  sql: "WITH d AS (SELECT jugador, fecha, AVG(puntaje) AS x FROM v_puntaje WHERE es_profesional=1 AND fecha<=:hasta GROUP BY jugador, fecha) SELECT jugador, COUNT(*) AS dias, ROUND(AVG(x),2) AS prom_dias, ROUND(SQRT(AVG(x*x)-AVG(x)*AVG(x)),2) AS desvio FROM d GROUP BY jugador ORDER BY desvio"
  n_minimo: 20
  unidad: puntos
  grafico: dispersion (promedio contra desvio)
- id: b_ranking_dia_titulos
  nombre: Titulos y medallas diarias
  seccion: B
  definicion: Cantidad de primeros, segundos y terceros puestos diarios (titulo = 1.o).
  calculo: "En v_ranking_dia (orden por puntaje_final desc y desempate por suma de rondas desc), contar posicion 1, 2 y 3 en dias cerrados del periodo."
  sql: "SELECT r.jugador, SUM(r.posicion=1) AS oros, SUM(r.posicion=2) AS platas, SUM(r.posicion=3) AS bronces FROM v_ranking_dia r JOIN dim_fecha f USING(fecha) WHERE f.es_profesional=1 AND f.dia_cerrado=1 AND r.fecha<=:hasta GROUP BY r.jugador ORDER BY oros DESC, platas DESC, bronces DESC"
  unidad: medallas
  grafico: barras apiladas / medallero
- id: b_mejor_peor_dia
  nombre: Mejor y peor partida
  seccion: B
  definicion: Mayor y menor puntaje final de cada jugador en el periodo, con su fecha.
  calculo: "MAX y MIN de puntaje_final por jugador (fact_partida del periodo); se informa la fecha."
  sql: "SELECT j.alias AS jugador, MAX(p.puntaje_final) AS mejor, MIN(p.puntaje_final) AS peor FROM fact_partida p JOIN dim_fecha f USING(fecha) JOIN dim_jugador j USING(id_jugador) WHERE f.es_profesional=1 AND p.fecha<=:hasta GROUP BY j.alias"
  unidad: puntos finales
  grafico: tabla
- id: b_copa_semanal
  nombre: Copa semanal (puntos de la semana)
  seccion: B
  definicion: Suma de puntos finales de lunes a domingo; las ausencias suman 0. Criterio oficial del torneo (semanas completas), se muestran las cerradas cuyo domingo cae dentro del periodo.
  calculo: "SUM(puntaje_final) por semana_inicio y jugador en dias cerrados (vista v_copa_semanal). Campeon = mayor suma. Desempate: cantidad de titulos diarios de la semana."
  sql: "SELECT semana_inicio, jugador, puntos, dias_jugados FROM v_copa_semanal WHERE semana_inicio>='2026-08-31' AND semana_inicio<=:hasta ORDER BY semana_inicio, puntos DESC"
  filtros: "semana_inicio >= 2026-08-31 (la semana del 31/8 al 6/9 incluye el 2/9, primer dia del profesionalismo); solo semanas con los 7 dias cerrados"
  unidad: puntos finales
  grafico: carrera acumulada + podio por semana
- id: b_copa_mensual
  nombre: Copa mensual (medallero del mes)
  seccion: B
  definicion: Orden olimpico por oros, platas y bronces diarios del mes; desempate por promedio de puntaje final de los dias jugados.
  calculo: "Vista v_medallero_mes (dias cerrados). Orden: oros desc, platas desc, bronces desc, promedio desc."
  sql: "SELECT anio_mes, jugador, oros, platas, bronces, promedio, dias_jugados FROM v_medallero_mes WHERE anio_mes>='2026-09' ORDER BY anio_mes, oros DESC, platas DESC, bronces DESC, promedio DESC"
  filtros: "meses cerrados dentro del periodo (septiembre completo incluye el 1/9, criterio oficial del torneo)"
  unidad: medallas
  grafico: tabla de medallero por mes
- id: b_trayectoria_divisiones
  nombre: Trayectoria de divisiones
  seccion: B
  definicion: Division de cada jugador al cierre de cada dia.
  calculo: "fact_division (foto al cierre del dia). Reglas: ausencia en dia cerrado o menos de 800 baja una; mas de 940 sube una; nunca por encima de 1.a."
  sql: "SELECT d.fecha, j.alias AS jugador, d.division FROM fact_division d JOIN dim_jugador j USING(id_jugador) WHERE d.fecha<=:hasta ORDER BY d.fecha, d.division"
  filtros: "LIMITACION: hoy hay fotos solo desde el 14/10. Antes de generar la presentacion hay que reconstruir fact_division desde el 2/9 (todos arrancaron en 1.a) con los ascensos y descensos registrados en maptap-resultados-diarios.md y la resolucion del 29/9."
  unidad: division
  grafico: bump chart
- id: b_titulos_challenge
  nombre: Historial de titulos de Challenge
  seccion: B
  definicion: Titulos (1.o), segundos y terceros del Challenge, contando solo dias con 5 o mas participantes y dia cerrado.
  calculo: "Vista v_titulos_challenge sobre v_challenge_dia (titulo_valido = participantes>=5 y dia cerrado)."
  sql: "SELECT jugador, titulos, segundos, terceros, dias_validos_jugados FROM v_titulos_challenge"
  filtros: "Challenge solo desde el 28/9 (no hay datos anteriores). Unico uso del Challenge en la presentacion."
  unidad: cantidad
  grafico: barras apiladas

# ====================== C. GEOGRAFIA TOP-DOWN ======================
- id: c_dificultad_zona
  nombre: Dificultad del grupo por zona (continente, region, pais)
  seccion: C
  definicion: Promedio nominal de TODOS los jugadores en las ubicaciones de la zona; menor promedio = zona mas dificil para el grupo.
  calculo: "AVG(puntaje) agrupado por la columna del nivel. Entra la zona con 5 o mas ubicaciones distintas en el periodo."
  sql:
    continente: "SELECT continente AS zona, COUNT(DISTINCT id_ubicacion) AS ubicaciones, COUNT(*) AS rondas, ROUND(AVG(puntaje),2) AS prom FROM v_puntaje WHERE es_profesional=1 AND fecha<=:hasta GROUP BY continente HAVING ubicaciones>=5 ORDER BY prom"
    region: "SELECT region AS zona, COUNT(DISTINCT id_ubicacion) AS ubicaciones, COUNT(*) AS rondas, ROUND(AVG(puntaje),2) AS prom FROM v_puntaje WHERE es_profesional=1 AND fecha<=:hasta GROUP BY region HAVING ubicaciones>=5 ORDER BY prom"
    pais: "SELECT pais AS zona, COUNT(DISTINCT id_ubicacion) AS ubicaciones, COUNT(*) AS rondas, ROUND(AVG(puntaje),2) AS prom FROM v_puntaje WHERE es_profesional=1 AND fecha<=:hasta GROUP BY pais HAVING ubicaciones>=5 ORDER BY prom"
  n_minimo: 5 ubicaciones
  unidad: puntos
  interpretacion: Una zona dificil lo es para todos; para juzgar a un jugador se usa Dif o exceso, no el promedio crudo.
  grafico: barras ordenadas + mapa mundial coloreado
- id: c_dificultad_ubicacion
  nombre: Ubicaciones mas faciles y mas dificiles
  seccion: C
  definicion: Promedio del grupo en cada ubicacion jugada (una aparicion de un lugar); se muestran las 10 mas faciles y las 10 mas dificiles.
  calculo: "AVG(puntaje) por id_ubicacion, exigiendo 6 o mas jugadores en esa ubicacion. Ordenar y tomar 10 por cada extremo."
  sql: "SELECT id_ubicacion, fecha, ronda, lugar, pais, COUNT(*) AS jugadores, ROUND(AVG(puntaje),2) AS prom FROM v_puntaje WHERE es_profesional=1 AND fecha<=:hasta GROUP BY id_ubicacion HAVING jugadores>=6 ORDER BY prom"
  n_minimo: 6 jugadores
  unidad: puntos
  grafico: barras (top 10 y bottom 10) + puntos en el mapa mundial
- id: c_top_zona_jugador
  nombre: Promedio de cada jugador por zona (para tops de 3)
  seccion: C
  definicion: Promedio nominal de cada jugador en cada zona; el top 3 de cada zona sale de ordenar estos promedios.
  calculo: "AVG(puntaje) por zona y jugador, con 10 o mas rondas del jugador. Una zona entra a los tops si al menos un jugador cumple el minimo. Argentina y Brasil entran siempre como paises."
  sql:
    continente: "SELECT continente AS zona, jugador, COUNT(*) AS n, ROUND(AVG(puntaje),2) AS prom FROM v_puntaje WHERE es_profesional=1 AND fecha<=:hasta GROUP BY continente, jugador HAVING n>=5 ORDER BY zona, prom DESC"
    region: "SELECT region AS zona, jugador, COUNT(*) AS n, ROUND(AVG(puntaje),2) AS prom FROM v_puntaje WHERE es_profesional=1 AND fecha<=:hasta GROUP BY region, jugador HAVING n>=10 ORDER BY zona, prom DESC"
    pais: "SELECT pais AS zona, jugador, COUNT(*) AS n, ROUND(AVG(puntaje),2) AS prom FROM v_puntaje WHERE es_profesional=1 AND fecha<=:hasta GROUP BY pais, jugador HAVING n>=10 ORDER BY zona, prom DESC"
  n_minimo: 10 rondas
  unidad: puntos
  grafico: podios por zona
- id: c_dispersion_zona
  nombre: Dispersion entre jugadores por zona
  seccion: C
  definicion: Desvio estandar de los promedios de los jugadores en la zona; mayor desvio = zona donde hay mas diferencia entre especialistas y flojos.
  calculo: "Con los promedios por zona y jugador (n>=10): SQRT(AVG(x^2)-AVG(x)^2). Entra la zona con 6 o mas jugadores que cumplen el minimo."
  sql: "WITH m AS (SELECT region AS zona, jugador, AVG(puntaje) AS x FROM v_puntaje WHERE es_profesional=1 AND fecha<=:hasta GROUP BY region, jugador HAVING COUNT(*)>=10) SELECT zona, COUNT(*) AS jugadores, ROUND(SQRT(AVG(x*x)-AVG(x)*AVG(x)),2) AS dispersion FROM m GROUP BY zona HAVING jugadores>=6 ORDER BY dispersion DESC"
  filtros: "Version por region; la de continente y pais se obtiene cambiando la columna."
  unidad: puntos
  grafico: dispersion (dificultad contra dispersion)
- id: c_exceso_zona_jugador
  nombre: Exceso de cada jugador por zona
  seccion: C
  definicion: Exceso promedio (sobre el grupo en las mismas rondas) de cada jugador en cada region.
  calculo: "Como b_exceso_prom pero agrupando ademas por region; n>=10 rondas."
  sql: "WITH g AS (SELECT fecha, ronda, AVG(puntaje) AS m FROM v_puntaje WHERE es_profesional=1 AND fecha<=:hasta GROUP BY fecha, ronda) SELECT p.region AS zona, p.jugador, COUNT(*) AS n, ROUND(AVG(p.puntaje-g.m),2) AS exceso FROM v_puntaje p JOIN g USING(fecha, ronda) WHERE p.es_profesional=1 AND p.fecha<=:hasta GROUP BY p.region, p.jugador HAVING n>=10"
  n_minimo: 10 rondas
  unidad: puntos
  grafico: mapa de calor jugador por region
- id: c_mapa_ubicaciones
  nombre: Puntos del mapa (ubicaciones con dificultad del grupo y exceso personal)
  seccion: C
  definicion: Una fila por aparicion con coordenadas, promedio del grupo y, para el mapa personal, el exceso del jugador en esa ubicacion.
  calculo: "Promedio del grupo por id_ubicacion; exceso del jugador = su puntaje - ese promedio. Coordenadas exactas de dim_lugar (maptap.gg)."
  sql: "SELECT id_ubicacion, lugar, pais, lat, lon, ROUND(AVG(puntaje),2) AS prom_grupo FROM v_puntaje WHERE es_profesional=1 AND fecha<=:hasta GROUP BY id_ubicacion HAVING COUNT(*)>=6"
  unidad: puntos
  grafico: mapa mundial y mapa de EE.UU. (contornos de datos/scripts/legacy)

# ====================== D. AGREGADORES POR CATEGORIA ======================
- id: d_dificultad_categoria
  nombre: Dificultad del grupo por categoria
  seccion: D
  definicion: Promedio nominal del grupo en las ubicaciones de cada una de las 47 categorias.
  calculo: "AVG(puntaje) sobre v_puntaje_categoria agrupado por categoria; entra con 5 o mas ubicaciones."
  sql: "SELECT categoria, COUNT(DISTINCT id_ubicacion) AS ubicaciones, COUNT(*) AS rondas, ROUND(AVG(puntaje),2) AS prom FROM v_puntaje_categoria WHERE es_profesional=1 AND fecha<=:hasta GROUP BY categoria HAVING ubicaciones>=5 ORDER BY prom"
  n_minimo: 5 ubicaciones
  unidad: puntos
  interpretacion: Las categorias complementarias (no costera, no capital, no pueblo) son contrapartes y se excluyen de las lecturas de sorpresa.
  grafico: barras ordenadas
- id: d_promedio_categoria_jugador
  nombre: Promedio y Dif por jugador y categoria
  seccion: D
  definicion: Promedio del jugador en la categoria y su diferencia con su propio promedio general (Dif).
  calculo: "AVG(puntaje) por categoria y jugador (n>=10) menos el promedio general del jugador en el periodo."
  sql: "WITH base AS (SELECT jugador, AVG(puntaje) AS g FROM v_puntaje WHERE es_profesional=1 AND fecha<=:hasta GROUP BY jugador) SELECT c.categoria, c.jugador, COUNT(*) AS n, ROUND(AVG(c.puntaje),2) AS prom, ROUND(AVG(c.puntaje)-b.g,2) AS dif FROM v_puntaje_categoria c JOIN base b USING(jugador) WHERE c.es_profesional=1 AND c.fecha<=:hasta GROUP BY c.categoria, c.jugador HAVING n>=10"
  n_minimo: 10 rondas
  unidad: puntos
  grafico: mapa de calor jugador por categoria (Dif) + lider por categoria
- id: d_sorpresas
  nombre: Mayores sorpresas
  seccion: D
  definicion: Las 10 combinaciones jugador por categoria con mayor Dif positivo y las 10 con mayor Dif negativo.
  calculo: "Sobre d_promedio_categoria_jugador, con n>=12, excluyendo categorias complementarias y las triviales por construccion (hemisferio norte, ciudad grande o mediana, no capital nacional). Ordenar por dif."
  sql: "SELECT 1"
  filtros: "Se calcula en el generador a partir de d_promedio_categoria_jugador (ya filtrado por n y categorias)."
  n_minimo: 12 rondas
  unidad: puntos
  grafico: barras divergentes

# ====================== E. RONDAS Y TIEMPO ======================
- id: e_prom_ronda
  nombre: Promedio por posicion de ronda
  seccion: E
  definicion: Promedio nominal en la ronda 1, 2, 3, 4 y 5 (por jugador y del grupo). Para combinaciones (1+2, 4+5) se pasan varias rondas.
  calculo: "AVG(puntaje) por jugador filtrando las rondas pedidas."
  sql: "SELECT jugador, ROUND(AVG(puntaje),2) AS prom, COUNT(*) AS n FROM v_puntaje WHERE es_profesional=1 AND fecha<=:hasta AND ronda IN (SELECT value FROM json_each(:rondas)) GROUP BY jugador ORDER BY prom DESC"
  n_minimo: 50
  unidad: puntos
  grafico: lineas por posicion de ronda + rankings
- id: e_caida_ronda5
  nombre: Caida en la ronda 5
  seccion: E
  definicion: Diferencia entre el promedio del jugador en la ronda 5 y su promedio en las rondas 1 a 4.
  calculo: "AVG(puntaje donde ronda=5) - AVG(puntaje donde ronda<=4), por jugador."
  sql: "SELECT jugador, ROUND(AVG(CASE WHEN ronda=5 THEN puntaje END)-AVG(CASE WHEN ronda<=4 THEN puntaje END),2) AS caida FROM v_puntaje WHERE es_profesional=1 AND fecha<=:hasta GROUP BY jugador ORDER BY caida"
  n_minimo: 100
  unidad: puntos
  interpretacion: Negativo = rinde menos al final. Insumo del premio al mas afectado por la ronda 5.
  grafico: barras divergentes
- id: e_prom_mensual
  nombre: Evolucion mensual del promedio
  seccion: E
  definicion: Promedio nominal por mes calendario de cada jugador.
  calculo: "AVG(puntaje) por anio_mes y jugador; se muestra el mes si el jugador tiene 20 o mas rondas en el mes."
  sql: "SELECT anio_mes, jugador, COUNT(*) AS n, ROUND(AVG(puntaje),2) AS prom FROM v_puntaje WHERE es_profesional=1 AND fecha<=:hasta GROUP BY anio_mes, jugador HAVING n>=20 ORDER BY jugador, anio_mes"
  n_minimo: 20 rondas por mes
  unidad: puntos
  grafico: lineas
- id: e_media_movil_jugador
  nombre: Media movil de 7 dias por jugador
  seccion: E
  definicion: Media movil de los promedios diarios del jugador en sus ultimos 7 dias jugados.
  calculo: "Por jugador, promedio diario AVG(puntaje); media movil de las ultimas 7 filas (dias jugados) del propio jugador."
  sql: "WITH d AS (SELECT jugador, fecha, AVG(puntaje) AS x FROM v_puntaje WHERE es_profesional=1 AND fecha<=:hasta GROUP BY jugador, fecha) SELECT jugador, fecha, ROUND(x,2) AS prom, ROUND(AVG(x) OVER (PARTITION BY jugador ORDER BY fecha ROWS 6 PRECEDING),2) AS mm7 FROM d ORDER BY jugador, fecha"
  unidad: puntos
  grafico: lineas (jugador contra grupo)
- id: e_racha_900
  nombre: Mayor racha de dias con 900 o mas
  seccion: E
  definicion: Maxima cantidad de dias seguidos del calendario de juego con puntaje final de 900 o mas. Una ausencia corta la racha.
  calculo: "Numerar los dias del periodo; por jugador quedarse con los dias con puntaje_final>=900; agrupar islas de dias consecutivos (dia - numero de orden) y tomar la isla mas larga."
  sql: "WITH dias AS (SELECT fecha, ROW_NUMBER() OVER (ORDER BY fecha) AS di FROM dim_fecha WHERE es_profesional=1 AND fecha<=:hasta), ok AS (SELECT p.id_jugador, d.di, ROW_NUMBER() OVER (PARTITION BY p.id_jugador ORDER BY d.di) AS rn FROM fact_partida p JOIN dias d USING(fecha) WHERE p.puntaje_final>=900), isl AS (SELECT id_jugador, di-rn AS g, COUNT(*) AS c FROM ok GROUP BY id_jugador, di-rn) SELECT j.alias AS jugador, MAX(c) AS racha FROM isl JOIN dim_jugador j USING(id_jugador) GROUP BY j.alias ORDER BY racha DESC"
  unidad: dias
  grafico: tabla o barras
- id: e_racha_100
  nombre: Mayor racha de rondas seguidas con 100
  seccion: E
  definicion: Maxima cantidad de rondas consecutivas (en orden de fecha y ronda) con puntaje 100. Una ronda no jugada o menor a 100 corta la racha.
  calculo: "Numerar todas las ubicaciones del periodo en orden; por jugador tomar las rondas con 100; islas de numeros consecutivos; la mas larga."
  sql: "WITH u AS (SELECT id_ubicacion, ROW_NUMBER() OVER (ORDER BY fecha, ronda) AS ui FROM fact_aparicion a JOIN dim_fecha f USING(fecha) WHERE f.es_profesional=1 AND a.fecha<=:hasta), ok AS (SELECT s.id_jugador, u.ui, ROW_NUMBER() OVER (PARTITION BY s.id_jugador ORDER BY u.ui) AS rn FROM fact_puntaje s JOIN u USING(id_ubicacion) WHERE s.puntaje=100), isl AS (SELECT id_jugador, ui-rn AS g, COUNT(*) AS c FROM ok GROUP BY id_jugador, ui-rn) SELECT j.alias AS jugador, MAX(c) AS racha FROM isl JOIN dim_jugador j USING(id_jugador) GROUP BY j.alias ORDER BY racha DESC"
  unidad: rondas
  grafico: tabla o barras

# ====================== F. PERFILES (por jugador, parametro :jug) ======================
- id: f_polar
  nombre: Perfil polar del jugador
  seccion: F
  definicion: "Rendimiento del jugador en 8 ejes comparado con el promedio del grupo en los mismos ejes. Ejes: Europa, Asia, America del Norte, America del Sur, Africa (continentes) y tres tematicos: Capitales (categoria Capital nacional), Historia (union de Guerras Mundiales y Antiguedad y patrimonio) y Naturaleza (union de Lugar de altura (>= 1.490 m), Zona arida y Atracción natural)."
  calculo: "Por eje: promedio nominal del jugador en las ubicaciones del eje y promedio del grupo en esas mismas ubicaciones; se grafica el Dif (jugador - su promedio general) o el exceso. Eje con menos de 10 rondas del jugador: no se dibuja (se anota)."
  sql: "WITH base AS (SELECT AVG(puntaje) AS g FROM v_puntaje WHERE jugador=:jug AND es_profesional=1 AND fecha<=:hasta) SELECT eje, COUNT(*) AS n, ROUND(AVG(puntaje),2) AS prom, ROUND(AVG(puntaje)-(SELECT g FROM base),2) AS dif FROM (SELECT continente AS eje, puntaje FROM v_puntaje WHERE jugador=:jug AND es_profesional=1 AND fecha<=:hasta AND continente IN ('Europa','Asia','América del Norte','América del Sur','África') UNION ALL SELECT 'Capitales', puntaje FROM v_puntaje_categoria WHERE jugador=:jug AND es_profesional=1 AND fecha<=:hasta AND categoria='Capital nacional' UNION ALL SELECT 'Historia', puntaje FROM (SELECT DISTINCT id_ubicacion, puntaje FROM v_puntaje_categoria WHERE jugador=:jug AND es_profesional=1 AND fecha<=:hasta AND categoria IN ('Guerras Mundiales','Antigüedad (fundada antes del año 1)')) UNION ALL SELECT 'Naturaleza', puntaje FROM (SELECT DISTINCT id_ubicacion, puntaje FROM v_puntaje_categoria WHERE jugador=:jug AND es_profesional=1 AND fecha<=:hasta AND categoria IN ('Lugar de altura (>= 1.490 m)','Zona arida o desierto','Atracción natural'))) GROUP BY eje"
  n_minimo: 10 rondas por eje
  unidad: puntos (Dif contra su propio promedio)
  grafico: radar (polar) jugador contra grupo
- id: f_fortalezas_debilidades
  nombre: Fortalezas y debilidades
  seccion: F
  definicion: "Las 5 zonas o categorias donde el jugador rinde mas por encima del promedio del grupo y las 5 donde mas por debajo (en las mismas ubicaciones)."
  calculo: "Universo: regiones, paises y categorias (sin complementarias ni hemisferio norte). Para cada ubicacion jugada por el jugador: puntaje - promedio del grupo en esa ubicacion. Dif = promedio de esa diferencia en la zona; n>=10 rondas del jugador. Ordenar por Dif; tomar 5 y 5. Solo profesionalismo."
  sql: "WITH g AS (SELECT id_ubicacion, AVG(puntaje) m FROM v_puntaje WHERE es_profesional=1 AND fecha<=:hasta GROUP BY id_ubicacion), b AS (SELECT p.id_ubicacion, p.region, p.pais, p.puntaje-g.m d FROM v_puntaje p JOIN g USING(id_ubicacion) WHERE p.jugador=:jug AND p.es_profesional=1 AND p.fecha<=:hasta) SELECT tipo, zona, COUNT(*) n, ROUND(AVG(d),2) dif FROM ( SELECT 'region' tipo, region zona, d FROM b UNION ALL SELECT 'pais', pais, d FROM b UNION ALL SELECT 'categoria', c.categoria, c.puntaje-g.m FROM v_puntaje_categoria c JOIN g USING(id_ubicacion) WHERE c.jugador=:jug AND c.es_profesional=1 AND c.fecha<=:hasta ) GROUP BY tipo, zona HAVING n>=10 ORDER BY dif DESC"
  n_minimo: 10 rondas
  unidad: puntos sobre el promedio del grupo
  grafico: listas por jugador
- id: f_highlights
  nombre: Logros y highlights
  seccion: F
  definicion: Mejores partidas, mayor racha y ubicaciones donde el jugador fue el mejor del grupo.
  calculo: "Top 3 puntaje_final del jugador; racha mas larga de 100 (e_racha_100) y de dias con 900 o mas (e_racha_900); ubicaciones (con 6 o mas jugadores) donde su puntaje fue el mayor del grupo (empates comparten)."
  sql: "WITH m AS (SELECT id_ubicacion, MAX(puntaje) AS mx, COUNT(*) AS n FROM v_puntaje WHERE es_profesional=1 AND fecha<=:hasta GROUP BY id_ubicacion HAVING n>=6) SELECT p.id_ubicacion, p.fecha, p.lugar, p.puntaje FROM v_puntaje p JOIN m USING(id_ubicacion) WHERE p.jugador=:jug AND p.puntaje=m.mx AND p.puntaje>=95 ORDER BY p.fecha"
  unidad: items
  grafico: lista destacada
- id: f_posiciones_ranking
  nombre: Posicion en cada ranking general
  seccion: F
  definicion: Lugar del jugador (1 a 11) en los rankings de la seccion B (promedio nominal, exceso, porcentaje de 100, puntaje final, consistencia, titulos).
  calculo: "Se toma de las metricas prom_nominal, b_exceso_prom, b_pct_100, b_prom_final, b_desvio_diario y b_ranking_dia_titulos; posicion = lugar en el orden de cada una."
  sql: "SELECT 1"
  filtros: "Composicion en el generador."
  grafico: fila de insignias

# ====================== G. PREMIOS (cada uno con su formula) ======================
- id: g_premios
  nombre: Premios y curiosidades
  seccion: G
  definicion: Premios generados por reglas explicitas. Todos exigen la muestra minima indicada.
  calculo: |
    El mas regular: menor desvio de los promedios diarios (b_desvio_diario), con 20 o mas dias.
    El mas viajero: mayor exceso promedio en ubicaciones de la categoria Lejos de Buenos Aires (mas de 12.000 km), con 10 o mas rondas.
    Arranca fuerte: mayor promedio en la ronda 1 (e_prom_ronda con rondas=[1]).
    Cierra fuerte: mayor promedio en las rondas 4 y 5.
    El mas afectado por la ronda 5: menor valor de e_caida_ronda5.
    El especialista: mayor Dif positivo individual (primer item de d_sorpresas).
    El mas parejo: menor desvio entre sus Dif por region (con 10 o mas rondas por region, minimo 5 regiones).
    El remontador: promedio del ultimo mes completo menos el del primer mes completo (e_prom_mensual).
    El rey del 100: mayor porcentaje de 100 (b_pct_100).
  sql: "SELECT 1"
  filtros: "Composicion en el generador; cada premio informa el valor y el n que lo sustenta."
  grafico: tarjetas de premio

- id: e_caida_x3
  nombre: Caída en las rondas x3 contra las x1
  seccion: E
  definicion: "El puntaje final pondera las rondas con multiplicadores x1 (R1 y R2), x2 (R3) y x3 (R4 y R5). Se compara el promedio nominal del jugador en las rondas x3 contra el de las rondas x1."
  calculo: "AVG(puntaje donde ronda IN (4,5)) - AVG(puntaje donde ronda IN (1,2)), por jugador. Negativo = rinde menos cuando la ronda vale más."
  sql: "SELECT jugador, ROUND(AVG(CASE WHEN ronda IN (4,5) THEN puntaje END)-AVG(CASE WHEN ronda IN (1,2) THEN puntaje END),2) AS caida FROM v_puntaje WHERE es_profesional=1 AND fecha<=:hasta GROUP BY jugador ORDER BY caida"
  n_minimo: 100
  unidad: puntos
  grafico: barras divergentes
